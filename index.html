<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finance Dashboard</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>
<body>

    <div class="card">
    <div class="card-header">
      <span class="tag">Finanças</span>
      <h1>Adicionar<br>Gasto</h1>
    </div>
 
    <div class="form-group">

      <label for="nomeGasto">Nome do gasto</label>

      <input
        type="text"
        id="nomeGasto"
        placeholder="Ex: Boleto, Aluguel"
      />
    </div>
 
    <div class="form-group">

      <label for="valorGasto">Valor</label>

      <div class="input-prefix">

        <span>R$</span>

        <input
          type="number"
          id="valorGasto"
          placeholder="0,00"
          min="0"
          step="0.01"
        />
      </div>
    </div>
 
    <div class="divider"></div>
 
    <button onclick="cadastrarGasto()">Cadastrar Gasto</button>

    <p id="feedback"></p>
  </div>

</body>
</html>
